# cargo-deny policy (`cargo deny check`). Permissive licenses only; no GPL.

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained (not a vulnerability). It arrives through Slint's
    # winit backend (sctk-adwaita → ab_glyph) and has no maintained upgrade yet.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only; transitive via slint/winit, no fix available" },
    # zvariant, zbus_names and zvariant_derive are unmaintained (not vulnerabilities).
    # They arrive through Slint's accessibility support (accesskit_unix → atspi → zbus)
    # and have no maintained upgrade yet (2026-08-04).
    { id = "RUSTSEC-2026-0370", reason = "unmaintained only; transitive via slint/accesskit, no fix available" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained only; transitive via slint/accesskit, no fix available" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained only; transitive via slint/accesskit, no fix available" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    # Slint is tri-licensed; its Royalty-free option is compatible with MIT.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"

# u8g2-fonts declares its license only through a LICENSE file: the crate is
# "MIT OR Apache-2.0", and each font keeps its U8g2 license (the fonts used are
# listed in crates/whether-panel/FONTS.md).
[[licenses.clarify]]
crate = "u8g2-fonts"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xdce28c5d }]

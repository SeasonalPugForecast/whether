[package]
name = "whether-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
std = []
# Slint's defaults without `compat-1-2` (which would pull libseat into kiosk builds)
# and without the unused system tray (a D-Bus stack).
desktop = ["std", "slint/std", "slint/compat-1-18", "slint/backend-default", "slint/renderer-femtovg", "slint/renderer-software", "slint/accessibility", "dep:png", "dep:thiserror", "dep:whether-display", "dep:whether-config", "dep:toml", "dep:serde", "dep:schemars", "dep:tracing"]
# Linux KMS without libseat: the kiosk user opens /dev/dri and /dev/input through
# the video, input and render groups (packaging/systemd/whether-kiosk.service).
kiosk = ["desktop", "slint/backend-linuxkms-noseat"]
mcu = ["slint/compat-1-2", "slint/unsafe-single-threaded", "slint/libm", "slint/renderer-software"]

[dependencies]
whether-core.workspace = true
slint.workspace = true
png = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
whether-display = { workspace = true, optional = true }
whether-config = { workspace = true, optional = true, features = ["std", "schema"] }
toml = { workspace = true, optional = true, features = ["std"] }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
whether-core = { workspace = true, features = ["testdata"] }
whether-providers.workspace = true
toml = { workspace = true, features = ["std", "display"] }

[build-dependencies]
slint-build.workspace = true

# A copy of the workspace lints with `unsafe_code = "deny"` instead of "forbid":
# Slint's generated code allows `unsafe` locally, which "forbid" cannot permit.
# Keep in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

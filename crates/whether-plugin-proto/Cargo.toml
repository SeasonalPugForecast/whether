[package]
name = "whether-plugin-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Golden protocol examples built from the core sample data (xtask, tests).
examples = ["whether-core/testdata"]

[dependencies]
whether-core = { workspace = true, features = ["serde", "schema"] }
# `rc`: state messages serialize the shared snapshots without copying them.
serde = { workspace = true, features = ["std", "rc"] }
serde_json = { workspace = true, features = ["std"] }
schemars.workspace = true
thiserror = { workspace = true, features = ["std"] }
whether-config = { workspace = true, features = ["std"] }
whether-display.workspace = true
toml = { workspace = true, features = ["std"] }
tracing.workspace = true

# A plugin for the exec integration tests (`CARGO_BIN_EXE_whether-test-plugin`).
[[bin]]
name = "whether-test-plugin"
path = "tests/bin/test_plugin.rs"
test = false
doc = false

[dev-dependencies]
whether-core = { workspace = true, features = ["serde", "schema", "testdata"] }
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true

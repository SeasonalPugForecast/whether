[package]
name = "whether-ffi"
description = "The Rust core for the iOS app, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` for the iOS XCFramework, `cdylib` for generating bindings.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
whether-core = { workspace = true, features = ["serde"] }
whether-providers = { workspace = true, features = ["serde"] }
whether-config = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
toml.workspace = true
thiserror.workspace = true
uniffi.workspace = true
async-trait.workspace = true

[dev-dependencies]
whether-core = { workspace = true, features = ["serde", "testdata"] }
pollster.workspace = true

# The workspace lints, except that UniFFI's generated scaffolding is `unsafe`
# (the hand-written code has none).
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

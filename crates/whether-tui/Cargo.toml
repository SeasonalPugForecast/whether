[package]
name = "whether-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["host"]
std = ["whether-config/std"]
host = ["std", "schema", "ratatui/crossterm", "dep:whether-display", "dep:whether-providers", "dep:toml"]
schema = ["std", "dep:schemars", "whether-core/schema", "whether-config/schema"]

[dependencies]
whether-core = { workspace = true, features = ["serde"] }
whether-config.workspace = true
ratatui.workspace = true
serde.workspace = true
libm.workspace = true
schemars = { workspace = true, optional = true }
whether-display = { workspace = true, optional = true }
whether-providers = { workspace = true, optional = true }
toml = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
whether-core = { workspace = true, features = ["serde", "testdata"] }
whether-config = { workspace = true, features = ["std"] }
insta.workspace = true
proptest.workspace = true
toml = { workspace = true, features = ["std", "display"] }

[lints]
workspace = true

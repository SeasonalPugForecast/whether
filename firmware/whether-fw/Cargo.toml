[package]
name = "whether-fw"
description = "whether on ESP32 boards: the device TUI and panel displays"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "whether-fw"
path = "./src/bin/main.rs"
test = false
doctest = false
bench = false

[features]
default = ["board-esp32-wroom-spi", "display-tui", "display-panel"]
# Boards (firmware/boards.toml); each enables its chip.
board-esp32-wroom-spi = ["chip-esp32"]
board-cyd = ["chip-esp32"]
# Chips: forwarded to the esp-* crates. Only the ESP32 is wired up so far.
chip-esp32 = [
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-alloc/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-radio/esp32",
    "esp-storage/esp32",
]
# Displays compiled into the image (device.display must be one of them).
display-tui = ["dep:whether-tui"]
display-panel = ["dep:whether-panel"]

[dependencies]
# Shared with the host (no_std).
fw-config.workspace = true
fw-sleep.workspace = true
whether-core.workspace = true
whether-providers.workspace = true
whether-tui = { workspace = true, optional = true }
whether-panel = { workspace = true, optional = true }

# As generated by esp-generate 1.4.0 (see firmware/README.md), with the chip moved
# into the chip-* features.
esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
log = "0.4.27"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "tcp", "udp"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["internal-heap-stats"] }
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "log-04", "unstable", "wifi"] }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "log",
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
critical-section = "1.2.0"
static_cell = "2.1.1"
# HTTPS: TLS 1.3 with RSA and ECDSA (P-256, P-384) chains,
# HTTP/1.1 framing only.
embedded-tls = { version = "0.19.0", default-features = false, features = ["log", "p384", "rsa"] }
reqwless = { version = "0.14.0", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
# The One Call reservation in the `nvs` partition.
esp-storage = { version = "0.10.0", features = ["embedded-storage"] }
sequential-storage = { version = "8.0.2" }
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

[build-dependencies]
fw-config = { workspace = true, features = ["build"] }
toml.workspace = true

[lints]
workspace = true

# The firmware workspace: bare-metal targets with the `esp` toolchain, separate
# from the host workspace. Build through `cargo xtask fw build --board <b>`.
[workspace]
resolver = "3"
members = ["whether-fw", "fw-config", "fw-sleep"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# Host-workspace crates (no_std builds).
whether-core = { path = "../crates/whether-core", default-features = false, features = ["serde"] }
whether-providers = { path = "../crates/whether-providers", default-features = false, features = ["serde"] }
whether-config = { path = "../crates/whether-config", default-features = false }
whether-tui = { path = "../crates/whether-tui", default-features = false }
whether-panel = { path = "../crates/whether-panel" }
fw-config = { path = "fw-config" }
fw-sleep = { path = "fw-sleep" }

serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
toml = { version = "1.1.6", default-features = false, features = ["serde", "parse", "std"] }

# The host workspace's lints, with `unsafe_code = "deny"` instead of "forbid":
# the esp-hal entry-point macros expand to `unsafe` that "forbid" cannot permit.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# Profiles as generated by esp-generate 1.4.0.
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
